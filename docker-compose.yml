services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: sqs
    ports: ["4566:4566"]
    volumes:
      - ./infra/localstack/init-queues.sh:/etc/localstack/init/ready.d/init-queues.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues | grep -q wager-transactions-dlq.fifo"]
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
